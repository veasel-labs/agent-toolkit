name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Registry validator (pins, trust, permissions, drift)
        run: python3 scripts/validate_registry.py
      - name: Resolve pins against upstream (annotated tags dereferenced)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate_registry.py --resolve
      - name: Generated manifests drift check
        run: python3 scripts/generate_manifests.py --check
      - name: Tests
        run: python3 -m unittest discover -s tests -v
