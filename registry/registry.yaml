# Veasel community plugin registry — Git-backed, review-gated.
#
# Each entry points at an EXTERNALLY maintained plugin; this repo never
# copies community plugin source. Provenance is pinned by commit SHA
# (borrowed from Claude Code marketplace `source` objects and Cursor's
# review-per-update model): a version bump requires a reviewed PR that
# changes `ref`/`sha` together. `upstream`/`upstream-lock` semantics
# follow schemas/upstream*.schema.json copied from agent-toolkit.
#
# Fields:
#   id          kebab-case, unique in this file
#   name        display name
#   description one line
#   source      { type: github|git-subdir|relative, repo?, url?, path?, ref, sha }
#               sha MUST be the resolved commit of ref (annotated tag -> its target commit, e.g. v1.49.0 -> 7bd44a7b...), verified with `gh api repos/<repo>/git/ref/tags/<ref>`; never a later main HEAD
#               relative = curated plugin bundled in THIS repo under plugins/
#   version     upstream plugin version at the pinned sha
#   license     SPDX id as declared by upstream (verified at review)
#   provenance  { submitted_by, reviewed_by, review: docs/REVIEW_POLICY.md }
#   targets     client manifests generated for these targets
version: 1
plugins:
  - id: agent-toolkit-core
    name: Agent Toolkit Core (personal collection)
    description: Core orchestration skills from the maintainer's personal toolkit, published into the Veasel catalog by reference — source stays in ulises-jeremias/agent-toolkit.
    source:
      type: github
      repo: ulises-jeremias/agent-toolkit
      path: plugins/agent-toolkit-core
      ref: v1.49.0
      sha: 7bd44a7b4cc64afc4908b49977589666c1978920
    version: 1.49.0
    license: MIT
    provenance:
      submitted_by: ulises-jeremias
      reviewed_by: null
      review: pending-initial-review
    trust: community
    permissions:
      # The pinned plugin starts a SessionStart command hook and its GitHub
      # MCP server needs network access. Keep the entry non-installable until
      # an independent reviewer verifies the complete upstream surface.
      shell: true
      network: true
      mcp: [github]
      hooks: [session-start-context]
      dangerous_permissions: []
    targets: [claude-code, cursor, veasel]  # codex/copilot: format not yet verified, not generated
  - id: veasel-essentials
    name: Veasel Essentials (official, bundled)
    description: Minimal official plugin with the output-handshake skill; usable fully offline. See docs/OFFLINE_SKILLS.md.
    # Relative (bundled) sources carry no sha: their content is pinned by
    # this repository's own commit, so a sha field would be self-referential
    # and misleading. The validator rejects a sha on relative sources.
    source:
      type: relative
      path: plugins/veasel-essentials
      ref: main
    version: 0.1.0
    license: MIT
    provenance:
      submitted_by: ulises-jeremias
      reviewed_by: ulises-jeremias (owner-approved first-party exception; issue 10)
      review: approved
    trust: first-party
    permissions:
      shell: false
      network: false
      mcp: []
      hooks: []
      dangerous_permissions: []
    targets: [claude-code, veasel]
  - id: agent-toolkit-creative-studio
    name: Agent Toolkit Creative Studio (personal collection)
    description: AI-native creative production skills driving real applications (Kdenlive, Blender, GIMP/Krita/Inkscape, OBS, REAPER, FFmpeg) with editable native projects preserved; published by reference from ulises-jeremias/agent-toolkit (ADR-046). Experimental; Kdenlive path host-verified, other app MCPs documented as experimental upstream.
    source:
      type: github
      repo: ulises-jeremias/agent-toolkit
      path: plugins/agent-toolkit-creative-studio
      ref: v1.50.0
      sha: 6303544045e3fc6ffbc5f085215eececdf7a7789
    version: 1.50.0
    license: MIT
    provenance:
      submitted_by: ulises-jeremias
      reviewed_by: null
      review: pending-initial-review
    trust: community
    permissions:
      shell: true
      network: true
      mcp: [kdenlive]
      hooks: []
      dangerous_permissions: []
    targets: [claude-code, cursor, veasel]  # codex/copilot: format not yet verified, not generated
